<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="100%" height="100%">
  <!-- A stopwatch whose hand sits just past the top: the fraction of a second that
       Homey's own Delay block cannot express, which is what this app is for. -->
  <!-- Filled geometry only. Homey draws the app icon from fills, so a stroked
       outline renders as nothing at all and the icon falls back to a placeholder. -->
  <!-- Transparent background; Homey applies the brandColor circle. -->

  <!-- The dial, as a ring: outer circle and inner circle, evenodd punching the hole. -->
  <path fill="#FFFFFF" fill-rule="evenodd" d="M 161.25 562.5 A 318.75 318.75 0 1 0 798.75 562.5 A 318.75 318.75 0 1 0 161.25 562.5 Z M 225 562.5 A 255 255 0 1 0 735 562.5 A 255 255 0 1 0 225 562.5 Z" />

  <!-- Crown, stem, both hands and the pivot. Separate path so the overlaps here
       union under nonzero winding instead of cancelling out under evenodd. -->
  <path fill="#FFFFFF" d="M 418.12 67.5 L 541.88 67.5 A 31.88 31.88 0 0 1 541.88 131.25 L 418.12 131.25 A 31.88 31.88 0 0 1 418.12 67.5 Z M 448.12 116.25 L 511.88 116.25 L 511.88 262.5 L 448.12 262.5 Z M 450 562.5 L 450 414.38 A 30 30 0 0 1 510 414.38 L 510 562.5 A 30 30 0 0 1 450 562.5 Z M 495.43 536.77 L 626.68 615.52 A 30 30 0 0 1 595.82 666.98 L 464.57 588.23 A 30 30 0 0 1 495.43 536.77 Z M 442.5 562.5 A 37.5 37.5 0 1 1 517.5 562.5 A 37.5 37.5 0 1 1 442.5 562.5 Z" />
</svg>
