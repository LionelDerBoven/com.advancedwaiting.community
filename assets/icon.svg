  <g fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="256" cy="296" r="160" />
    <path d="M 208 56 L 304 56" />
    <path d="M 256 56 L 256 136" />
    <path d="M 256 296 L 256 200" />
    <path d="M 256 296 L 322 330" />
  </g>
</svg>
