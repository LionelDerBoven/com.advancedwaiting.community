<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- A stopwatch reading a fraction of a turn: the hand sits just past the top,
       which is the whole point of the app - the part of a second Homey's own
       Delay block cannot express. -->
